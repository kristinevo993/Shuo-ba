<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nói đại đi – Shuō Ba 说吧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --card:#FFFFFF; --line:#EBEAE4; --ink:#2D3136; --mute:#8A8D91; --faint:#B5B7B9;
  --c1:#FDF2D0; --c2:#E3F1E5; --c3:#E3EEF8; --c4:#FBE8DF; --c5:#EFE8F8; --c6:#F9E4EA;
  --r1:#E9C766; --r2:#8FC499; --r3:#8DB4DB; --r4:#E8A688; --r5:#B9A3DD; --r6:#DE95AA;
  --ok:#5E9E6B; --warn:#D08B4E; --bad:#C9677D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1}
.top .sub{font-size:12px;color:var(--mute);font-weight:500}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:17px}
main{flex:1;padding:4px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--mute)}
.hero{display:flex;gap:10px;align-items:stretch;margin:4px 0 16px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--mute)}
.review-cta{display:flex;align-items:center;gap:12px;background:var(--c5);border-radius:16px;padding:14px 16px;margin-bottom:18px;width:100%;text-align:left}
.review-cta .big{font-size:26px}
.review-cta b{display:block}
.section-t{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin:18px 4px 8px}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.topic .emo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.topic .tt{flex:1;min-width:0}
.topic .tt b{display:block;font-weight:600;font-size:15px}
.topic .tt small{color:var(--mute);font-size:12px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--r2);border-radius:4px}
.topic.lock{opacity:.45}
/* lesson */
.seg{display:flex;background:#F0EFEA;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.controls{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.steps{display:flex;gap:6px;margin:4px 0 12px}
.steps button{flex:1;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--faint);background:transparent;border:1px solid var(--line)}
.steps button.on{color:var(--ink);background:var(--card);border-color:var(--ink)}
.steps button.done{color:var(--ok)}
.scene{height:150px;border-radius:12px;display:grid;place-items:center;font-size:64px;margin-bottom:14px;position:relative;overflow:hidden}
.scene .lbl{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.75);padding:3px 8px;border-radius:8px;color:var(--ink)}
.sit{font-size:12px;color:var(--mute);font-weight:500;margin-bottom:8px}
.line{line-height:2.05;margin:0 0 4px}
.line.vi{font-size:18px;font-weight:500}
.line.py{font-size:16px;color:#4A4F55}
.line.zh{font-size:14px;color:var(--faint)}
.ch{border-radius:6px;padding:2px 5px;margin:0 1px;transition:box-shadow .15s;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ch.hl{box-shadow:0 0 0 2px var(--rc)}
.c1{background:var(--c1);--rc:var(--r1)}.c2{background:var(--c2);--rc:var(--r2)}.c3{background:var(--c3);--rc:var(--r3)}
.c4{background:var(--c4);--rc:var(--r4)}.c5{background:var(--c5);--rc:var(--r5)}.c6{background:var(--c6);--rc:var(--r6)}
.hidden-line{font-size:13px;color:var(--faint);font-style:italic;margin:4px 0}
.play{display:flex;gap:8px;margin-top:14px}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.pbtn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pbtn.playing{opacity:.7}
/* shadow */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 6px}
.mic{width:96px;height:96px;border-radius:50%;background:var(--c6);border:2px solid var(--r6);font-size:38px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.mic.rec{background:var(--r6);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(222,149,170,.6)}100%{box-shadow:0 0 0 22px rgba(222,149,170,0)}}
.note{font-size:13px;background:var(--c1);border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.5}
/* builder */
.answer{min-height:64px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin:12px 0}
.answer.ok{border-color:var(--ok);border-style:solid;background:#F3F9F4}
.answer.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 12px;border-radius:10px;font-size:15px;border:1px solid rgba(0,0,0,.05);font-weight:500}
.chip.ghost{opacity:.18;pointer-events:none}
.chip.wrong{outline:2px solid var(--bad)}
/* review */
.count{font-size:44px;font-weight:700;text-align:center;margin:10px 0;color:var(--r5)}
.rate{display:flex;gap:8px;margin-top:14px}
.rate button{flex:1;padding:12px 4px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.3}
.rate small{display:block;font-weight:400;font-size:11px;opacity:.75}
.r-bad{background:var(--c6)}.r-mid{background:var(--c4)}.r-ok{background:var(--c2)}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.nav .in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.nav button{padding:15px;border-radius:14px;font-weight:600;font-size:15px}
.nav .prev{background:var(--card);border:1px solid var(--line);width:56px}
.nav .next{flex:1;background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 10px}
.empty .big{font-size:52px}

svg text{font-family:"Be Vietnam Pro",system-ui,sans-serif}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(250,249,246,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom));z-index:9}
.tabs .in{max-width:460px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button .e{font-size:22px;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--ink)}
.tabs button.on .e{filter:none;opacity:1}
/* reminder */
.remind{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px 16px;margin-bottom:6px}
.remind .big{font-size:28px}
.remind b{display:block;font-size:15px}
.remind small{font-size:12px;color:#5c6066}
/* commute */
.now{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.phase{display:inline-block;align-self:center;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;background:#F0EFEA}
.now .vi{font-size:21px;font-weight:600;line-height:1.45}
.now .py{font-size:17px;color:#4A4F55;min-height:24px}
.now .zh{font-size:14px;color:var(--faint);min-height:20px}
.now .meta{font-size:12px;color:var(--mute)}
.cd{font-size:40px;font-weight:700;color:var(--r5);min-height:48px}
.player{display:flex;justify-content:center;align-items:center;gap:22px;margin:18px 0}
.player .pp{width:78px;height:78px;border-radius:50%;background:var(--ink);color:#fff;font-size:30px;display:grid;place-items:center}
.player .sk{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.opt{margin-bottom:12px}
.opt .lab{font-size:12px;font-weight:600;color:var(--mute);margin:0 4px 6px}
.sel{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px;color:var(--ink)}
/* stats */
.ringrow{display:flex;gap:16px;align-items:center}
.ringrow .info{flex:1}
.ringrow .info b{font-size:15px}
.kv{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px;color:#4A4F55}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;line-height:1.5}
.legend{display:flex;gap:16px;font-size:12px;color:#4A4F55;margin:2px 0 6px}
.legend span{display:flex;align-items:center;gap:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:11px;font-weight:600;line-height:1.35}
.badge .e{font-size:28px;display:block;margin-bottom:4px}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge small{display:block;font-weight:400;color:var(--mute);font-size:10px}
</style>
</head>

/* ---------- lưu tiến độ ---------- */
const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let srs = store.get("srs",{});      // {cardId:{due, r}}
let prefs = store.get("prefs",{show:"zh", mode:"split"});

/* ---------- danh sách câu ---------- */
function sentencesOf(topic, mode){
  const out=[];
  topic.situations.forEach((s,i)=>{
    const lv = mode==="split" ? ["1A","1B"] : ["2"];
    lv.forEach(L=>out.push({id:s.id+"_"+L, level:L, sitTitle:s.title, sitNo:i+1, topic, data:s[L]}));
  });
  return out;
}
function allSentences(){ return DATA.topics.flatMap(t=>[...sentencesOf(t,"split"),...sentencesOf(t,"full")]); }
const byId = Object.fromEntries(allSentences().map(s=>[s.id,s]));
const zhText = d=>d.zh.map(x=>x.t).join("");

/* ---------- âm thanh (tạm dùng giọng đọc của máy) ---------- */
let zhVoice=null, viVoice=null, speaking=false;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  viVoice = vs.find(v=>/^vi/i.test(v.lang)) || null;
  zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang) && /Xiaoxiao|Tingting|Google/i.test(v.name)) || vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate=1, lang="zh-CN"){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){ toast("Máy không hỗ trợ đọc giọng"); return res(); }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate = rate; const v = lang==="zh-CN"?zhVoice:viVoice; if(v) u.voice=v;
    u.onend=u.onerror=()=>{speaking=false;res()};
    speaking=true; speechSynthesis.speak(u);
  });
}

/* ---------- trạng thái màn hình ---------- */
let S = {screen:"home"};
const app = document.getElementById("app");
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- vẽ 1 dòng có tô màu theo cụm ---------- */
function lineHTML(segs, cls){
  return `<p class="line ${cls}">`+segs.map(s=> s.n
    ? `<span class="ch c${((s.n-1)%6)+1}" data-n="${s.n}">${esc(s.t)}</span>`
    : `<span>${esc(s.t)}</span>`).join(" ")+`</p>`;
}
function bindChunkTaps(root){
  root.querySelectorAll(".ch").forEach(el=>el.onclick=()=>{
    const n=el.dataset.n, card=el.closest(".card");
    const on = !el.classList.contains("hl");
    card.querySelectorAll(".ch").forEach(c=>c.classList.toggle("hl", on && c.dataset.n===n));
  });
}
function scene(sent){
  const [emo,col]=TOPIC_STYLE[sent.topic.id]||["💬","--c3"];
  return `<div class="scene" style="background:var(${col})">${emo}<span class="lbl">Ảnh minh hoạ (sẽ thay ảnh thật)</span></div>`;
}

    ${DATA.topics.map(t=>{
      const [emo,col]=TOPIC_STYLE[t.id]||["💬","--c3"];
      const ids=[...sentencesOf(t,"split"),...sentencesOf(t,"full")].map(s=>s.id);

/* ================= BÀI HỌC ================= */
function openTopic(tid){
  const topic = DATA.topics.find(t=>t.id===tid);
  S = {screen:"lesson", topic, idx:0, step:1};
  rebuildList(); render();
}
function learnedTopics(){ return DATA.topics.filter(t=>[...sentencesOf(t,"split"),...sentencesOf(t,"full")].some(s=>srs[s.id])); }
function openMix(){
  const src = learnedTopics().length ? learnedTopics() : DATA.topics;
  const pool = src.flatMap(t=>[...sentencesOf(t,"split"),...sentencesOf(t,"full")]);
  S = {screen:"lesson", mix:true, list:shuffle(pool).slice(0,20), idx:0, step:4, tally:{ok:0,mid:0,bad:0}};
  render();
}
function rebuildList(){ if(S.mix) return; S.list = sentencesOf(S.topic, prefs.mode); if(S.idx>=S.list.length) S.idx=0; }
const STEP_NAMES=["① Nghe","② Nhại","③ Ghép","④ Nhớ"];

function renderLesson(){
  const sent = S.list[S.idx];
  app.innerHTML = `

    <div style="flex:1;min-width:0"><h1 style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${S.mix?"🎲 Mix tổng hợp":esc(S.topic.title.split("(")[0].trim())}</h1>
    <div class="sub">Câu ${S.idx+1}/${S.list.length} · ${S.mix?(sent.level==="2"?"Câu ghép":"Mảnh "+sent.level)+" · "+esc(sent.topic.title.split("(")[0].trim()):(prefs.mode==="split"?"Mảnh "+sent.level:"Câu ghép")}</div></div></div>
  <main>

    </div>

  </main>

  document.getElementById("back").onclick=()=>{speechSynthesis.cancel();S={screen:"home"};render()};
  app.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{prefs.mode=b.dataset.v;store.set("prefs",prefs);

/* ---- Bước 3: Ghép cụm phản xạ ---- */
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}return b}
function stepBuild(body, sent){
  const pieces = sent.data.py.map((s,i)=>({...s,i}));
  let pool = shuffle(pieces); let tries=0;
  while(pieces.length>1 && pool.every((p,k)=>p.i===k) && tries++<10) pool=shuffle(pieces);
  let ans=[];
  body.innerHTML = `
  <div class="card">
    <div class="sit">Chạm các mảnh Pinyin theo đúng thứ tự câu</div>
    ${lineHTML(sent.data.vi,"vi")}
    <div class="answer" id="ans"></div>
    <div class="pool" id="pool"></div>
    <div class="play"><button class="pbtn alt" id="reset">↺ Làm lại</button><button class="pbtn alt" id="hint">💡 Nghe gợi ý</button></div>
    <div id="res"></div>
  </div>`;
  bindChunkTaps(body);
  const A=body.querySelector("#ans"), P=body.querySelector("#pool");
  const chip=p=>`<button class="chip ${p.n?"c"+(((p.n-1)%6)+1):""}" data-i="${p.i}" style="${p.n?"":"background:#F0EFEA"}">${esc(p.t)}</button>`;
  const draw=()=>{
    A.className="answer";
    A.innerHTML = ans.map(chip).join("");
    P.innerHTML = pool.map(p=> ans.includes(p)? chip(p).replace('class="chip','class="chip ghost'):chip(p)).join("");
    P.querySelectorAll(".chip:not(.ghost)").forEach(b=>b.onclick=()=>{ans.push(pool.find(p=>p.i==b.dataset.i));draw();check()});
    A.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ans=ans.filter(p=>p.i!=b.dataset.i);draw()});
  };
  const check=()=>{
    if(ans.length<pieces.length) return;
    const ok = ans.every((p,k)=>p.t===pieces[k].t);
    if(ok){ A.classList.add("ok"); body.querySelector("#res").innerHTML=`<div class="note" style="background:var(--c2)">✅ Chuẩn rồi! Nghe lại và đọc to theo nhé.</div>`; speak(zhText(sent.data),1); }
    else { A.classList.add("bad"); const k=ans.findIndex((p,k)=>p.t!==pieces[k].t); A.children[k]?.classList.add("wrong"); body.querySelector("#res").innerHTML=`<div class="note" style="background:var(--c6)">Chưa đúng ở mảnh viền đỏ – chạm vào mảnh đó để gỡ ra và thử lại.</div>`; }
  };
  body.querySelector("#reset").onclick=()=>{ans=[];body.querySelector("#res").innerHTML="";draw()};
  body.querySelector("#hint").onclick=()=>speak(zhText(sent.data),.75);
  draw();
}

  timer=setInterval(()=>{ n--; if(!document.body.contains(body)||S.step!==4&&S.screen==="lesson"){clearInterval(timer);return}
    if(n>0) draw("wait",n); else {clearInterval(timer); draw("ready");} },1000);

let stats = store.get("stats",{days:{}, goal:20});
const dayKey = (d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function dayOf(k){ return stats.days[k] || (stats.days[k]={learn:0,listen:0,heard:0}); }
let lastAct=Date.now(), lastTick=Date.now();
["pointerdown","keydown","scroll","touchstart"].forEach(e=>addEventListener(e,()=>lastAct=Date.now(),{passive:true}));
function tickStats(){
  const now=Date.now(), dt=Math.min(60,(now-lastTick)/1000); lastTick=now;
  const d=dayOf(dayKey());
  if(C.playing) d.listen+=dt;
  else if(!document.hidden && (S.screen==="lesson"||S.screen==="review") && now-lastAct<90000) d.learn+=dt;
  store.set("stats",stats);
}
setInterval(tickStats,5000);
document.addEventListener("visibilitychange",tickStats);
const mins = s=>Math.round(s/60);
const totalMin = k=>{const d=stats.days[k];return d?(d.learn+d.listen)/60:0};
function streak(){
  let n=0, d=new Date();
  if(totalMin(dayKey(d))<5) d.setDate(d.getDate()-1);   // hôm nay chưa đủ thì tính từ hôm qua
  while(totalMin(dayKey(d))>=5){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const CHEERS=[["加油！","Jiāyóu! – Cố lên!"],["说吧！","Shuō ba! – Nói đại đi!"],["慢慢来","Mànmàn lái – Từ từ rồi sẽ được"],["熟能生巧","Shú néng shēng qiǎo – Quen tay hay việc"],["每天进步一点点","Měitiān jìnbù yīdiǎndiǎn – Mỗi ngày tiến bộ một chút"]];

let C = store.get("commute",{source:"all", level:"both", gap:5, speed2:1, sleep:0});
Object.assign(C,{playing:false, token:0, list:[], idx:0, phase:"", sleepEnd:0, ui:null, showPy:false, cd:0});
const saveC=()=>store.set("commute",{source:C.source,level:C.level,gap:C.gap,speed2:C.speed2,sleep:C.sleep});
const viText = s=>s.data.vi.map(x=>x.t).join(" ");
const pyText = s=>s.data.py.map(x=>x.t).join(" ");
function buildCommuteList(){
  let pool=[];
  DATA.topics.forEach(t=>{
    if(C.source.startsWith("t") && C.source!=="t"+t.id) return;
    if(C.level!=="full") pool.push(...sentencesOf(t,"split"));
    if(C.level!=="split") pool.push(...sentencesOf(t,"full"));
  });
  if(C.source==="smart") pool=pool.filter(s=>srs[s.id] && srs[s.id].r!=="ok");
  return shuffle(pool);
}
let actx=null;
function tickSound(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain();
  o.frequency.value=880; g.gain.setValueAtTime(.12,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.12);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.13);}catch(e){} }
// âm thanh im lặng chạy nền để tai nghe Bluetooth điều khiển được
let silent=null;
function silentAudio(){ if(silent) return silent;
  const sr=8000,n=sr, buf=new ArrayBuffer(44+n*2), v=new DataView(buf); const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  silent=new Audio(URL.createObjectURL(new Blob([buf],{type:"audio/wav"}))); silent.loop=true; return silent; }
function setupMediaSession(){
  if(!("mediaSession" in navigator)) return;
  const s=C.list[C.idx];
  try{ navigator.mediaSession.metadata=new MediaMetadata({title:s?viText(s):"Nói đại đi", artist:"Shuō Ba 说吧 · Nghe", album:s?s.topic.title:""});
    navigator.mediaSession.setActionHandler("play",()=>startCommute());
    navigator.mediaSession.setActionHandler("pause",()=>pauseCommute());
    navigator.mediaSession.setActionHandler("nexttrack",()=>skip(1));
    navigator.mediaSession.setActionHandler("previoustrack",()=>skip(-1));
  }catch(e){}
}
let wakeLock=null;
async function keepAwake(on){ try{ if(on && "wakeLock" in navigator){wakeLock=await navigator.wakeLock.request("screen")} else if(wakeLock){wakeLock.release();wakeLock=null} }catch(e){} }

const wait=(ms,tok)=>new Promise(r=>{const end=Date.now()+ms; const f=()=>{ if(tok!==C.token||Date.now()>=end) r(); else setTimeout(f,100)}; f();});
async function loop(tok){
  while(C.playing && tok===C.token){
    if(C.sleepEnd && Date.now()>=C.sleepEnd){ pauseCommute(); C.sleepEnd=0; toast("⏱ Hết giờ hẹn – nghỉ thôi!"); return; }
    const s=C.list[C.idx]; if(!s){ pauseCommute(); return; }
    setupMediaSession(); C.showPy=false;
    C.phase="🇻🇳 Tiếng Việt"; paintCommute();
    if(viVoice) await speak(viText(s),1,"vi-VN"); else await wait(1800,tok);
    if(tok!==C.token) return;
    C.phase="🤫 Tự nhẩm trong đầu"; tickSound();
    for(let k=C.gap;k>0;k--){ C.cd=k; paintCommute(); await wait(1000,tok); if(tok!==C.token) return; }
    C.cd=0; C.showPy=true; C.phase="🇨🇳 Tiếng Trung · lần 1"; paintCommute();
    await speak(zhText(s.data),1); if(tok!==C.token) return;
    C.phase="🗣️ Nhại lại"; paintCommute(); await wait(1500,tok); if(tok!==C.token) return;
    C.phase="🇨🇳 Lần 2 · "+(C.speed2===1?"1.0x":"0.75x"); paintCommute();
    await speak(zhText(s.data),C.speed2); if(tok!==C.token) return;
    dayOf(dayKey()).heard++; store.set("stats",stats);
    await wait(700,tok); if(tok!==C.token) return;
    C.idx++; if(C.idx>=C.list.length){ C.list=shuffle(C.list); C.idx=0; }
  }
}
function startCommute(){
  if(!C.list.length){ C.list=buildCommuteList(); C.idx=0; }
  if(!C.list.length){ toast(C.source==="smart"?"Chưa có câu nào bị đánh dấu Quên sạch / Hơi vấp":"Không có câu nào để phát"); return; }
  if(!viVoice && !C.warnedVi){ C.warnedVi=true; toast("Máy chưa có giọng tiếng Việt – app sẽ hiện chữ thay vì đọc"); }
  C.playing=true; C.token++; lastTick=Date.now();
  C.sleepEnd = C.sleep? Date.now()+C.sleep*60000 : 0;
  try{ silentAudio().play().catch(()=>{}); }catch(e){}
  keepAwake(true);
  if("mediaSession" in navigator) navigator.mediaSession.playbackState="playing";
  loop(C.token); paintCommute();
}
function pauseCommute(){
  tickStats(); C.playing=false; C.token++; speechSynthesis.cancel(); C.phase="⏸ Tạm dừng"; C.cd=0;
  try{ silent && silent.pause(); }catch(e){}
  keepAwake(false);
  if("mediaSession" in navigator) navigator.mediaSession.playbackState="paused";
  paintCommute();
}
function skip(dir){
  if(!C.list.length) return;
  const was=C.playing; if(was){C.token++;speechSynthesis.cancel();}
  C.idx=(C.idx+dir+C.list.length)%C.list.length; C.showPy=false; C.phase=was?"":"⏸ Tạm dừng";
  if(was){ C.playing=true; loop(C.token); }
  paintCommute();
}
function resetCommuteList(){ const was=C.playing; if(was) pauseCommute(); C.list=buildCommuteList(); C.idx=0; saveC(); if(was) startCommute(); else render(); }

function renderCommute(){
  const smartN = allSentences().filter(s=>srs[s.id]&&srs[s.id].r!=="ok").length;
  const chips=(name,opts,cur)=>`<div class="seg" data-name="${name}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(cur)===String(v)?"on":""}">${l}</button>`).join("")}</div>`;
  app.innerHTML=`
  <div class="top"><div style="flex:1"><h1>Nghe 🎧</h1><div class="sub">Bỏ điện thoại vào túi, đeo tai nghe và nghe thôi</div></div></div>
  <main>
    <div id="nowBox"></div>
    <div class="player"><button class="sk" id="pv">⏮</button><button class="pp" id="pp">▶</button><button class="sk" id="nx">⏭</button></div>
    <div class="opt"><div class="lab">Nghe câu nào?</div>
      <select class="sel" id="src">
        <option value="all">🔀 Tất cả chủ đề (xáo trộn)</option>
        <option value="smart">🧠 Smart Mix – câu hay quên (${smartN})</option>
        ${DATA.topics.map(t=>`<option value="t${t.id}">📂 ${t.id}. ${esc(t.title.split("(")[0].trim())}</option>`).join("")}
      </select></div>
    <div class="opt"><div class="lab">Loại câu</div>${chips("level",[["split","🧩 Mảnh ngắn"],["full","🔗 Câu ghép"],["both","Cả hai"]],C.level)}</div>
    <div class="opt"><div class="lab">Khoảng lặng để tự nhẩm</div>${chips("gap",[[3,"3 giây"],[5,"5 giây"],[7,"7 giây"]],C.gap)}</div>
    <div class="opt"><div class="lab">Tiếng Trung lần 2</div>${chips("speed2",[[1,"Tốc độ chuẩn 1.0x"],[0.75,"Chậm 0.75x"]],C.speed2)}</div>
    <div class="opt"><div class="lab">Hẹn giờ tắt</div>${chips("sleep",[[0,"Không"],[15,"15 phút"],[30,"30 phút"]],C.sleep)}</div>
    <div class="note">📌 Bản xem trước: giữ màn hình sáng khi nghe. Bản cài lên điện thoại (dùng file mp3 thật) sẽ phát tiếp khi khoá màn hình và bấm được Play/Next trên tai nghe Bluetooth.</div>
  </main>`;
  const src=app.querySelector("#src"); src.value=C.source;
  src.onchange=()=>{C.source=src.value; resetCommuteList();};
  app.querySelectorAll(".seg[data-name]").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const k=seg.dataset.name; C[k]= k==="level"? b.dataset.v : +b.dataset.v; saveC();
    if(k==="level") return resetCommuteList();
    if(k==="sleep") C.sleepEnd = C.playing && C.sleep ? Date.now()+C.sleep*60000 : 0;
    seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  }));
  app.querySelector("#pp").onclick=()=> C.playing?pauseCommute():startCommute();
  app.querySelector("#pv").onclick=()=>skip(-1);
  app.querySelector("#nx").onclick=()=>skip(1);
  C.ui=true; if(!C.list.length) C.list=buildCommuteList();
  paintCommute();
}
function paintCommute(){
  if(!C.ui || S.screen!=="commute") return;
  const box=document.getElementById("nowBox"); if(!box) return;
  const s=C.list[C.idx], d=dayOf(dayKey());
  const left = C.playing&&C.sleepEnd ? ` · tắt sau ${Math.max(1,Math.ceil((C.sleepEnd-Date.now())/60000))} phút` : "";
  box.innerHTML = s ? `<div class="now">
      <span class="phase">${C.phase||"Sẵn sàng – bấm ▶ để nghe"}</span>
      <div class="vi">${esc(viText(s))}</div>
      <div class="cd">${C.cd||""}</div>
      <div class="py">${C.showPy?esc(pyText(s)):""}</div>
      <div class="zh">${C.showPy?esc(zhText(s.data)):""}</div>
      <div class="meta">Câu ${C.idx+1}/${C.list.length} · ${esc(s.topic.title.split("(")[0].trim())}</div>
      <div class="meta">Hôm nay đã nghe ${d.heard} câu · ${mins(d.listen)} phút${left}</div>
    </div>` : `<div class="now"><div class="vi">Chưa có câu nào</div><div class="meta">${C.source==="smart"?"Học và chấm “Quên sạch / Hơi vấp” để có câu cho Smart Mix":""}</div></div>`;
  const pp=document.getElementById("pp"); if(pp) pp.textContent=C.playing?"⏸":"▶";
}

/* ================= TIẾN ĐỘ ================= */
const COL_LEARN="#5B8FC9", COL_LISTEN="#E39B6A";
function ring(pct){
  const r=42,c=2*Math.PI*r, p=Math.min(1,pct);
  return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="#EFEEE9" stroke-width="10"/>
  <circle cx="55" cy="55" r="${r}" fill="none" stroke="${p>=1?"#5E9E6B":COL_LEARN}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 55 55)"/>
  <text x="55" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="#2D3136">${Math.round(pct*100)}%</text>
  <text x="55" y="72" text-anchor="middle" font-size="11" fill="#8A8D91">mục tiêu</text></svg>`;
}
function chartHTML(days){
  const W=340,H=170,pl=26,pr=4,pt=10,pb=24, iw=W-pl-pr, ih=H-pt-pb;
  const vals=days.map(k=>{const d=stats.days[k]||{learn:0,listen:0};return {k,l:d.learn/60,s:d.listen/60}});
  const maxV=Math.max(stats.goal, ...vals.map(v=>v.l+v.s));
  const step = maxV>60?30:maxV>30?15:10, top=Math.ceil(maxV/step)*step;
  const y=v=>pt+ih-(v/top)*ih, bw=iw/vals.length, w=Math.max(6,bw*0.58);
  let g="";
  for(let v=0; v<=top; v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#EFEEE9"/><text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="#8A8D91">${v}</text>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(stats.goal)}" y2="${y(stats.goal)}" stroke="#2D3136" stroke-dasharray="3 3" opacity=".35"/>`;
  const bars=vals.map((v,i)=>{
    const x=pl+i*bw+(bw-w)/2, hl=(v.l/top)*ih, hs=(v.s/top)*ih, base=pt+ih, gap=(hl>0&&hs>0)?2:0;
    const rr=Math.min(4,w/2);
    const seg=(yTop,h,col,round)=> h<=0?"" : round
      ? `<path d="M${x},${yTop+h} V${yTop+rr} Q${x},${yTop} ${x+rr},${yTop} H${x+w-rr} Q${x+w},${yTop} ${x+w},${yTop+rr} V${yTop+h} Z" fill="${col}"/>`
      : `<rect x="${x}" y="${yTop}" width="${w}" height="${h}" fill="${col}"/>`;
    const lab=v.k.slice(8)+(i===vals.length-1?"*":"");
    return `<g>${seg(base-hl,hl,COL_LEARN,hs<=0)}${seg(base-hl-gap-hs,hs,COL_LISTEN,true)}
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="${i===vals.length-1?"#2D3136":"#8A8D91"}">${v.k.slice(8)}</text>
      <rect class="hit" data-i="${i}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih+pb}" fill="transparent"/></g>`;
  }).join("");
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Số phút học và nghe 14 ngày gần nhất">${g}${bars}</svg>`, vals, x:i=>pl+i*bw+bw/2, y:v=>y(v), W};
}
function renderStats(){
  tickStats();
  const k=dayKey(), d=dayOf(k), tot=(d.learn+d.listen)/60;
  const days=[...Array(14)].map((_,i)=>{const x=new Date(); x.setDate(x.getDate()-13+i); return dayKey(x);});
  const week=days.slice(7).reduce((a,k)=>{const v=stats.days[k];if(v){a.l+=v.learn;a.s+=v.listen;a.h+=v.heard}return a},{l:0,s:0,h:0});
  const all=Object.values(stats.days).reduce((a,v)=>{a.l+=v.learn;a.s+=v.listen;a.h+=v.heard;return a},{l:0,s:0,h:0});
  const st=streak(), best=bestStreak();
  const B=[["🌱","Khởi động","Học ngày đầu tiên",all.l+all.s>60],["🔥","3 ngày liền","Chuỗi 3 ngày",best>=3],["🏅","Tuần bền bỉ","Chuỗi 7 ngày",best>=7],
    ["📚","Chăm học","Tổng 60 phút học",all.l>=3600],["🎧","Tai thính","Tổng 60 phút nghe",all.s>=3600],["💯","Trăm câu","Nghe 100 câu",all.h>=100],
    ["🎯","Đạt mục tiêu","1 ngày đủ phút",Object.keys(stats.days).some(k=>totalMin(k)>=stats.goal)],["🗺️","Nhà thám hiểm","Học đủ 3 chủ đề",DATA.topics.every(t=>sentencesOf(t,"split").some(s=>srs[s.id]))],["🐉","Rồng Shuō Ba","Chuỗi 30 ngày",best>=30]];
  const ch=chartHTML(days);
  app.innerHTML=`
  <div class="top"><div style="flex:1"><h1>Tiến độ 📊</h1><div class="sub">Mỗi ngày một chút – 说吧!</div></div></div>
  <main>
    <div class="card ringrow">${ring(tot/stats.goal)}
      <div class="info"><b>Hôm nay: ${Math.round(tot)} / ${stats.goal} phút</b>
        <div class="kv"><span class="sw" style="background:${COL_LEARN}"></span>Học chủ động: ${mins(d.learn)} phút</div>
        <div class="kv"><span class="sw" style="background:${COL_LISTEN}"></span>Nghe thụ động: ${mins(d.listen)} phút</div>
        <div class="kv">🔥 Chuỗi: <b>${st} ngày</b> · kỷ lục ${best}</div></div></div>
    <div class="section-t">14 ngày gần nhất (phút)</div>
    <div class="card">
      <div class="legend"><span><i class="sw" style="background:${COL_LEARN}"></i>Học chủ động</span><span><i class="sw" style="background:${COL_LISTEN}"></i>Nghe thụ động</span><span style="opacity:.6">┄ mục tiêu</span></div>
      <div class="chart" id="chart">${ch.svg}<div class="tip" id="tip"></div></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">7 ngày qua: học ${mins(week.l)} phút · nghe ${mins(week.s)} phút · ${week.h} câu. Chạm vào cột để xem chi tiết.</p>
    </div>
    <div class="section-t">Mục tiêu mỗi ngày</div>
    <div class="seg" id="goal">${[10,20,30,45].map(g=>`<button data-v="${g}" class="${stats.goal===g?"on":""}">${g} phút</button>`).join("")}</div>
    <div class="section-t">Huy hiệu</div>
    <div class="badges">${B.map(([e,n,dsc,ok])=>`<div class="badge ${ok?"":"off"}"><span class="e">${e}</span>${n}<small>${dsc}</small></div>`).join("")}</div>
    <p class="muted" style="font-size:11px;text-align:center;margin-top:16px">Ngày được tính vào chuỗi khi học + nghe từ 5 phút trở lên.<br>Chỉ tính thời gian khi bạn đang thao tác hoặc đang phát ở tab Nghe.</p>
  </main>`;
  app.querySelectorAll("#goal button").forEach(b=>b.onclick=()=>{stats.goal=+b.dataset.v;store.set("stats",stats);render()});
  const tip=document.getElementById("tip"), box=document.getElementById("chart");
  box.querySelectorAll(".hit").forEach(h=>{
    const show=()=>{ const i=+h.dataset.i, v=ch.vals[i], sc=box.clientWidth/ch.W;
      const [yy,mm,dd]=v.k.split("-");
      tip.innerHTML=`<b>${dd}/${mm}</b><br><span class="sw" style="display:inline-block;background:${COL_LEARN}"></span> Học ${Math.round(v.l)} phút<br><span class="sw" style="display:inline-block;background:${COL_LISTEN}"></span> Nghe ${Math.round(v.s)} phút`;
      tip.style.left=Math.min(box.clientWidth-60,Math.max(60,ch.x(i)*sc))+"px"; tip.style.top=(ch.y(v.l+v.s)*sc-6)+"px"; tip.style.opacity=1; };
    h.addEventListener("pointerenter",show); h.addEventListener("click",show);
    h.addEventListener("pointerleave",()=>tip.style.opacity=0);
  });
}
function bestStreak(){
  const ks=Object.keys(stats.days).filter(k=>totalMin(k)>=5).sort(); let best=0,cur=0,prev=null;
  ks.forEach(k=>{ const d=new Date(k+"T00:00"); if(prev && (d-prev)/864e5===1) cur++; else cur=1; best=Math.max(best,cur); prev=d; });
  return best;
}

render();
</script>
</body>
